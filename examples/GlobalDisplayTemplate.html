<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif}
:root{--fg:#f5f5f7;--bg:#191a1f;--idle:#30323a;--pressed:#fff;--pressedText:#111}
html[data-kd-theme="light"]{--fg:#111;--bg:#f1f2f5;--idle:#fff;--pressed:#111;--pressedText:#fff}
#root{width:100%;height:100%;display:grid;place-items:center;color:var(--fg);opacity:var(--kd-opacity)}
.keys{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}.key{min-width:42px;height:42px;padding:0 10px;border-radius:12px;background:var(--idle);display:grid;place-items:center;font-weight:700;transform:scale(1)}.key.down{background:var(--pressed);color:var(--pressedText)}.key small{font-size:9px;opacity:.62}
.mouse{display:flex;width:92%;height:82%;border-radius:24px;overflow:hidden;background:var(--bg)}.mouse>div{flex:1;display:grid;place-items:center}.mouse small{opacity:.62}.mouse>div.down{background:var(--pressed);color:var(--pressedText)}
.trajectory{width:92%;height:92%;border-radius:18px;background:var(--bg);position:relative}.dot{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--fg);translate:-50% -50%;will-change:transform}
.stick{width:86%;height:86%;border-radius:50%;background:var(--bg);position:relative}.knob{position:absolute;left:50%;top:50%;width:38%;height:38%;border-radius:50%;background:var(--fg);translate:-50% -50%;will-change:transform}
.face{position:relative;width:100%;height:100%}.face i{position:absolute;width:29%;height:29%;border-radius:50%;background:var(--idle);display:grid;place-items:center;font-style:normal;font-weight:700}.face i.down{background:var(--pressed);color:var(--pressedText)}.face .t{left:35.5%;top:3%}.face .r{right:3%;top:35.5%}.face .b{left:35.5%;bottom:3%}.face .l{left:3%;top:35.5%}
.shoulder{width:92%;height:88%;display:grid;gap:8px}.shoulder div{border-radius:13px;background:var(--bg);display:grid;place-items:center;font-weight:700;overflow:hidden;position:relative}.shoulder div.down{background:var(--pressed);color:var(--pressedText)}
</style></head><body><div id="root"></div>
<script>
const root=document.querySelector('#root');let state=null,px=0,py=0,vx=0,vy=0,raf=0;
function el(tag,cls,text){const n=document.createElement(tag);n.className=cls||'';if(text!=null)n.textContent=text;return n}
function render(s){state=s;root.replaceChildren();
 if(s.type==='keyboard'||s.type==='custom'||s.type==='key-prompt'){const box=el('div','keys');for(const k of s.keys||[]){const n=el('div','key'+(k.pressed?' down':''));n.dataset.id=k.id;n.append(el('b','',k.label));if(k.cps)n.append(el('small','',k.cps+' CPS'));box.append(n)}root.append(box)}
 else if(s.type==='mouse'){const m=el('div','mouse');for(const side of ['left','right']){const n=el('div');n.dataset.side=side;n.append(el('b','',side==='left'?'Left':'Right'),el('small','','0 CPS'));m.append(n)}root.append(m);updateMouse(s.mouse)}
 else if(s.type==='mouse-trajectory'){const b=el('div','trajectory');b.append(el('i','dot'));root.append(b)}
 else if(s.type.includes('stick')){const b=el('div','stick');if(s.config.stickShape==='square')b.style.borderRadius='18px';b.append(el('i','knob'));root.append(b);updateGamepad(s.gamepad)}
 else if(s.type==='gamepad-face'){const f=el('div','face');[['t','Y'],['r','B'],['b','A'],['l','X']].forEach(x=>f.append(el('i',x[0],x[1])));root.append(f);updateGamepad(s.gamepad)}
 else if(s.type.includes('shoulder')){const sh=el('div','shoulder');sh.innerHTML=s.type.includes('left')?'<div id="one">L1</div><div id="two">L2</div>':'<div id="one">R1</div><div id="two">R2</div>';root.append(sh);updateGamepad(s.gamepad)}
}
function updateKey(k){const n=root.querySelector(`[data-id="${CSS.escape(String(k.id))}"]`);if(!n)return;n.classList.toggle('down',!!k.pressed);const small=n.querySelector('small');if(small)small.textContent=(k.cps||0)+' CPS';if(KeyDisplay.reducedMotion())return;n.getAnimations().forEach(a=>a.cancel());n.animate(k.pressed?[{transform:'scale(1)'},{transform:'scale(.91)'}]:[{transform:'scale(.91)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],{duration:k.pressed?90:180,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'})}
function updateMouse(m){if(!m)return;for(const side of ['left','right']){const n=root.querySelector(`[data-side="${side}"]`);if(!n)continue;n.classList.toggle('down',!!m[side]);const small=n.querySelector('small');if(small)small.textContent=(m[side+'Cps']||0)+' CPS'}}
function updateGamepad(g){if(!state||!g)return;if(state.type.includes('stick')){const k=root.querySelector('.knob');if(!k)return;const right=state.type.includes('right'),x=right?g.rx:g.lx,y=right?g.ry:g.ly;k.style.transform=`translate3d(${x*28}px,${y*28}px,0)`}else if(state.type==='gamepad-face'){const b=g.buttons||{},v=[b.y,b.b,b.a,b.x];root.querySelectorAll('.face i').forEach((n,i)=>n.classList.toggle('down',!!v[i]))}else if(state.type.includes('shoulder')){const left=state.type.includes('left'),b=g.buttons||{},one=root.querySelector('#one'),two=root.querySelector('#two');if(one)one.classList.toggle('down',left?b.l1:b.r1);if(two){two.classList.toggle('down',left?b.l2:b.r2);const p=left?g.lt:g.rt;two.style.background=`linear-gradient(90deg,var(--pressed) ${p*100}%,var(--bg) ${p*100}%)`}}}
function kickPointer(d){vx+=Math.sign(d.dx)*Math.sqrt(Math.abs(d.dx))*.72;vy+=Math.sign(d.dy)*Math.sqrt(Math.abs(d.dy))*.72;if(!raf)raf=requestAnimationFrame(tick)}
function tick(){vx+=(-px*.105-vx*.21);vy+=(-py*.105-vy*.21);px+=vx;py+=vy;px=Math.max(-30,Math.min(30,px));py=Math.max(-30,Math.min(30,py));const d=root.querySelector('.dot');if(d)d.style.transform=`translate3d(${px}px,${py}px,0)`;if(Math.abs(px)+Math.abs(py)+Math.abs(vx)+Math.abs(vy)<.04){px=py=vx=vy=0;if(d)d.style.transform='translate3d(0,0,0)';raf=0;return}raf=requestAnimationFrame(tick)}
KeyDisplay.onState(render);
KeyDisplay.on('key',e=>updateKey(e.detail));
KeyDisplay.on('mouse',e=>updateMouse(e.detail));
KeyDisplay.on('gamepad',e=>updateGamepad(e.detail));
KeyDisplay.on('pointer',e=>kickPointer(e.detail));
</script></body></html>
