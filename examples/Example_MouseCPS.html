<!doctype html><style>html,body{margin:0;width:100%;height:100%;background:transparent}#m{display:flex;width:100%;height:100%;overflow:hidden;border-radius:24px;background:#191a20;color:#fff;font-family:system-ui}#m>div{flex:1;display:grid;place-items:center;transition:transform 90ms}#m>div.down{background:#fff;color:#111;transform:scale(.96)}small{opacity:.6}</style><div id="m"></div><script>addEventListener('keydisplay:update',e=>{const s=e.detail;if(s.type!=='mouse')return;m.innerHTML=s.keys.map(k=>`<div class="${k.pressed?'down':''}"><b>${k.label}</b><small>${k.dps} CPS</small></div>`).join('')})</script>
