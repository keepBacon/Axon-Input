<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#box{width:100%;height:100%;border-radius:18px;background:var(--kd-trajectory-panel,#18191e);position:relative;opacity:var(--kd-opacity)}
#dot{width:12px;height:12px;border-radius:50%;background:var(--kd-trajectory-dot,#fff);position:absolute;left:50%;top:50%;translate:-50% -50%;transform:translate3d(0,0,0) scale(var(--dot-scale,1));will-change:transform}
</style>
<div id="box"><i id="dot"></i></div>
<script>
let x=0,y=0,vx=0,vy=0,raf=0,state=null;
KeyDisplay.onState(s=>{if(s.type!=='mouse-trajectory')return;state=s;dot.style.setProperty('--dot-scale',(s.config?.dotSizePercent||100)/100)});
KeyDisplay.on('mouse',e=>{
  if(!state)return;const m=e.detail,c=state.config||{},p=state.palette||{};
  dot.style.background=m.left&&c.showTrajectoryLeftColor?c.trajectoryLeftColor:m.right&&c.showTrajectoryRightColor?c.trajectoryRightColor:(p.trajectoryDot||'#fff');
});
KeyDisplay.on('pointer',e=>{
  const {dx,dy}=e.detail;vx+=Math.sign(dx)*Math.sqrt(Math.abs(dx))*.85;vy+=Math.sign(dy)*Math.sqrt(Math.abs(dy))*.85;
  if(!raf)raf=requestAnimationFrame(tick);
});
function tick(){
  vx+=(-x*.115-vx*.23);vy+=(-y*.115-vy*.23);x+=vx;y+=vy;
  x=Math.max(-31,Math.min(31,x));y=Math.max(-31,Math.min(31,y));
  dot.style.transform=`translate3d(${x}px,${y}px,0) scale(var(--dot-scale,1))`;
  if(Math.abs(x)+Math.abs(y)+Math.abs(vx)+Math.abs(vy)<.04){x=y=vx=vy=0;dot.style.transform='translate3d(0,0,0) scale(var(--dot-scale,1))';raf=0;return}
  raf=requestAnimationFrame(tick);
}
</script>
