<!doctype html><style>html,body{margin:0;background:transparent}.key{width:48px;height:48px;border-radius:14px;background:#24262d;color:#fff;display:grid;place-items:center;font:700 16px sans-serif}</style><div id="root"></div><script>
function render(s){if(s.type!=='keyboard'&&s.type!=='custom')return;root.innerHTML='';s.keys.forEach(k=>{let e=document.createElement('div');e.className='key';e.dataset.id=k.id;e.textContent=k.label;root.appendChild(e)})}
addEventListener('keydisplay:update',e=>render(e.detail));addEventListener('keydisplay:key',e=>{let n=document.querySelector(`[data-id="${e.detail.id}"]`);if(!n)return;n.animate(e.detail.pressed?[{transform:'scale(1)'},{transform:'scale(.88)'}]:[{transform:'scale(.88)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:e.detail.pressed?85:220,easing:'cubic-bezier(.2,.85,.25,1)',fill:'forwards'})});</script>
