<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:transparent}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#background,#leftKey,#rightKey,#fallback{object-fit:fill;pointer-events:none}
#background{z-index:0}#fallback{z-index:1}#live2dCanvas{z-index:2}#leftKey,#rightKey{z-index:3}
.hidden{display:none!important}
</style></head><body>
<div id="stage">
  <img id="background" class="layer" src="resources/background.png" alt="">
  <img id="fallback" class="layer" src="resources/cover.png" alt="">
  <canvas id="live2dCanvas" class="layer"></canvas>
  <img id="leftKey" class="layer hidden" alt="">
  <img id="rightKey" class="layer hidden" alt="">
</div>
<script src="../live2dcubismcore.min.js"></script>
<script src="mocdata.js"></script>
<script src="runtime.js"></script></body></html>
